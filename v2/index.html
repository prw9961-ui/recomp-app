<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f4f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Recomp"><link rel="apple-touch-icon" href="../icon-180.png"><title>Recomp</title></head><body><style>
/* layout: a phone-app screen (top bar / scrolling body / bottom tab bar)
   centered on a desk backdrop on wide screens, full-bleed on an actual phone */
:root {
  --stage: #ebe9e3;
  --screen: #f5f4f0;
  --surface: #ffffff;
  --ink: #0b0b0c;
  --muted: #6b6963;
  --line: #d9d7cf;
  --accent: #3652ff;
  --accent-ink: #ffffff;
  --good: #1f9d55;
  --warn: #b8860b;
  --bad: #c23b3b;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: Inter, -apple-system, system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
}
h1, h2, .brand { font-family: "Space Grotesk", Inter, sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
.tabular { font-variant-numeric: tabular-nums; }

.device {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  background: var(--screen);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
@media (min-width: 561px) {
  .device {
    height: min(860px, 92dvh);
    border-radius: 42px;
    border: 1px solid var(--line);
    box-shadow: 0 40px 70px -28px rgba(11, 11, 12, 0.35);
    overflow: hidden;
    position: relative;
  }
  .device::before {
    content: "";
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 84px; height: 5px;
    border-radius: 3px;
    background: var(--line);
    z-index: 5;
  }
}

.screen-top {
  flex-shrink: 0;
  padding: max(22px, env(safe-area-inset-top, 0px)) 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.toprow { display: flex; justify-content: space-between; align-items: baseline; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.brand .dot { color: var(--accent); }
.step-tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.close-x {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

.progress { display: flex; gap: 5px; }
.progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.progress i.done { background: var(--ink); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 5px 9px;
  border-radius: 999px;
  background: var(--line);
  color: var(--muted);
  align-self: flex-start;
}
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tag.good { background: #e7f6ec; color: var(--good); }
.tag.warn { background: #fbf1dd; color: var(--warn); }
.tag.bad { background: #f9e7e7; color: var(--bad); }
.tag.neutral { background: var(--line); color: var(--muted); }

.screen-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 22px 26px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
.screen-body > * { flex-shrink: 0; }

.eyebrow { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; }
h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

/* ---- Today screen ---- */
.coach-note {
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 0 10px 10px 0;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.coach-note .k { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); }
.coach-note .v { font-size: 13px; line-height: 1.4; }

.exercise-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.exercise-row { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ex-main { display: flex; align-items: center; gap: 12px; }
.exercise-row .idx { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 700; color: var(--muted); width: 18px; flex-shrink: 0; }
.exercise-row .name { flex: 1; font-size: 14px; font-weight: 600; min-width: 0; }
.exercise-row .set { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.exercise-row .rm { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--screen); color: var(--muted); font-size: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ex-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.exbtn { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--screen); color: var(--muted); cursor: pointer; font-family: inherit; }
.exbtn:hover { border-color: var(--ink); color: var(--ink); }
.exbtn.on { border-color: var(--accent); color: var(--accent); }
.ex-note { font-size: 12px; font-style: italic; color: var(--muted); background: var(--screen); border-radius: 8px; padding: 8px 10px; }
.ex-note .hint { font-style: normal; font-weight: 700; font-size: 10px; letter-spacing: 0.04em; color: var(--accent); display: block; margin-bottom: 2px; }
.comment-editor { display: flex; flex-direction: column; gap: 8px; background: var(--screen); border-radius: 10px; padding: 10px; }
.comment-editor textarea, .note-field textarea {
  width: 100%; min-height: 56px; padding: 10px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font-size: 13px; font-family: inherit; resize: vertical;
}
.comment-editor textarea:focus, .note-field textarea:focus { outline: none; border-color: var(--accent); }
.comment-editor .row2 { display: flex; gap: 8px; }
.comment-editor .row2 button { flex: 1; padding: 9px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
.comment-editor .row2 .save { border: none; background: var(--ink); color: var(--screen); }
.comment-editor .row2 .cancel { border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.note-field { display: flex; flex-direction: column; gap: 6px; }
.note-field .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
.add-row { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 12px; padding: 13px 14px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; }
.add-row:hover { border-color: var(--ink); color: var(--ink); }
.add-panel { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; }
.add-panel .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
.quick-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.quick-chip { font-size: 12px; font-weight: 600; padding: 7px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--screen); color: var(--ink); cursor: pointer; font-family: inherit; }
.quick-chip:hover { border-color: var(--accent); }
.create-row { display: flex; gap: 8px; }
.create-row input[type=text] { flex: 1; min-width: 0; padding: 10px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--screen); color: var(--ink); font-size: 14px; font-family: inherit; }
.create-row input[type=text]:focus { outline: none; border-color: var(--accent); }
.create-row button { flex-shrink: 0; padding: 10px 14px; border-radius: 10px; border: none; background: var(--ink); color: var(--screen); font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }

.cta {
  margin-top: auto;
  background: var(--ink);
  color: var(--screen);
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.cta.done-cta { background: var(--good); }

.logged-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.logged-chip {
  font-size: 11px;
  font-weight: 700;
  padding: 6px 9px;
  border-radius: 999px;
  background: var(--surface);
  border: 1.5px solid var(--line);
}

/* ---- Week screen ---- */
.week-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
}
.week-row.today { border-color: var(--ink); background: #fff; box-shadow: 0 0 0 1px var(--ink) inset; }
.week-row .d { width: 44px; flex-shrink: 0; text-align: center; }
.week-row .d .wd { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.week-row .d .num { font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 700; }
.week-row .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; }

/* ---- feedback choice cards ---- */
.choice-list { display: flex; flex-direction: column; gap: 10px; }
.choice-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
}
.choice-card .t { font-size: 15px; font-weight: 700; }
.choice-card .h { font-size: 12px; color: var(--muted); margin-top: 2px; }
.choice-card .mark {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  flex-shrink: 0;
}
.choice-card.selected { border-color: var(--ink); background: #fff; }
.choice-card.selected .mark { background: var(--ink); border-color: var(--ink); }
.choice-card .mark.square { border-radius: 5px; display: flex; align-items: center; justify-content: center; color: var(--screen); font-size: 12px; font-weight: 700; }
.choice-card .h.who { color: var(--ink); font-weight: 600; }

/* ---- setup wizard reuse ---- */
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  flex: 1; min-width: 38px; padding: 14px 0; text-align: center;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer; font-family: "JetBrains Mono", monospace;
}
.chip:hover { border-color: var(--ink); }
.chip.selected { background: var(--ink); border-color: var(--ink); color: var(--screen); }

.seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; padding: 11px 8px; border: none; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.seg button.active { background: var(--ink); color: var(--screen); }

.day-row { display: flex; align-items: center; gap: 10px; }
.day-label { width: 58px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--muted); font-family: "JetBrains Mono", monospace; text-transform: uppercase; }
.duration-input { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.duration-input input[type=number] {
  width: 100%; min-width: 0; padding: 11px 10px; border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font-size: 15px; font-family: "JetBrains Mono", monospace;
}
.duration-input input[type=number]:focus { outline: none; border-color: var(--accent); }
.unit-seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--surface); }
.unit-seg button { padding: 10px 10px; border: none; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; font-family: "JetBrains Mono", monospace; }
.unit-seg button.active { background: var(--ink); color: var(--screen); }

.split-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.split-row:last-of-type { border-bottom: none; }
.split-name { font-size: 15px; font-weight: 600; }
.split-hint { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; cursor: pointer; font-family: inherit; }
.stepper button:disabled { opacity: 0.3; cursor: default; }
.stepper .n { width: 20px; text-align: center; font-size: 16px; font-weight: 700; font-family: "JetBrains Mono", monospace; }

.tally { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; font-family: "JetBrains Mono", monospace; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); }
.tally.ok { color: var(--good); border-color: var(--good); }
.tally.off { color: var(--accent); border-color: var(--accent); }

.summary-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.summary-row:last-of-type { border-bottom: none; }
.summary-row .k { color: var(--muted); }
.summary-row .v { font-weight: 700; text-align: right; font-family: "JetBrains Mono", monospace; }

.inline-nav { display: flex; gap: 10px; margin-top: 6px; }
button.primary, button.ghost {
  font-family: inherit; font-size: 15px; font-weight: 700; border-radius: 12px; padding: 14px 18px; cursor: pointer; border: 1.5px solid transparent;
}
button.primary { flex: 1; background: var(--ink); color: var(--screen); }
button.primary:disabled { opacity: 0.3; cursor: default; }
button.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }

.done-screen { align-items: center; text-align: center; gap: 12px; justify-content: center; flex: 1; }
.done-mark { width: 52px; height: 52px; border-radius: 50%; background: var(--good); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; }

/* ---- footer / tab bar ---- */
.screen-footer { flex-shrink: 0; padding: 14px 22px max(14px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--screen); display: flex; gap: 10px; }

.tab-bar {
  flex-shrink: 0;
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--screen);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab-bar button {
  flex: 1;
  background: none;
  border: none;
  padding: 11px 4px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  color: var(--muted);
  font-family: inherit;
}
.tab-bar button .mark2 { font-size: 16px; }
.tab-bar button .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
.tab-bar button.active { color: var(--ink); }

@media (max-width: 560px) {
  body { padding: 0; }
  .screen-top, .screen-body, .screen-footer { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
}
.lock input[type=password] { padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 16px; font-family: inherit; }
.lock input[type=password]:focus { outline: none; border-color: var(--accent); }
.lock .rem { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.lock-err { color: var(--bad); }

/* ---- set logging ---- */
.set-table { display: flex; flex-direction: column; gap: 6px; background: var(--screen); border-radius: 10px; padding: 10px; }
.set-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.set-row .sn { width: 30px; flex-shrink: 0; font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; color: var(--muted); }
.set-head { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.set-head .hc { width: 64px; padding-left: 2px; }
.set-head .x { visibility: hidden; }
.set-row .rmset { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; }
.add-set { align-self: flex-start; font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; padding: 7px 10px; border-radius: 8px; border: 1.5px dashed var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.add-set:hover { border-color: var(--ink); color: var(--ink); }
.set-row input { width: 64px; min-width: 0; padding: 7px 6px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-family: "JetBrains Mono", monospace; font-size: 13px; }
.set-row input:focus { outline: none; border-color: var(--accent); }
.set-row .x { color: var(--muted); font-size: 11px; }
.set-row .done { margin-left: auto; width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 700; cursor: pointer; }
.set-row .done.on { background: var(--good); border-color: var(--good); color: #fff; }
.set-count { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; color: var(--good); white-space: nowrap; }

/* ---- coaching-style additions on Today ---- */
.style-row { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.style-row .body { flex: 1; min-width: 0; }
.style-row .src { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); }
.style-row .n { font-size: 14px; font-weight: 600; margin-top: 2px; }
.style-row .w { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.style-row .s { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; white-space: nowrap; }
.style-row .add { margin-top: 8px; }

/* ---- next week ---- */
.change-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.change-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.change-name { font-size: 14px; font-weight: 600; min-width: 0; }
.change-from { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); }
.change-from b { color: var(--ink); }
.change-why { font-size: 12px; color: var(--muted); line-height: 1.45; }
.tag.swap { background: #e8ecff; color: var(--accent); }

/* ---- progress ---- */
.move-pick { display: flex; flex-direction: column; gap: 6px; }
.move-pick span { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
.move-pick select {
  appearance: none; -webkit-appearance: none; width: 100%; padding: 12px 40px 12px 14px;
  border: 1.5px solid var(--line); border-radius: 12px; background-color: var(--surface); color: var(--ink);
  font: 600 15px Inter, -apple-system, system-ui, sans-serif; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
}
.move-pick select:focus { outline: none; border-color: var(--accent); }
.chart-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; position: relative; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chart-head .k { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
.big { font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.big small { font-size: 13px; color: var(--muted); font-weight: 600; }
.delta { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 700; color: var(--good); }
.chart-card svg { width: 100%; height: auto; display: block; margin-top: 10px; touch-action: none; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-area { fill: var(--accent); opacity: 0.08; }
.ch-line { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ch-pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ch-lbl { fill: var(--muted); font: 600 10px "JetBrains Mono", monospace; }
.ch-end { fill: var(--ink); font: 700 11px "JetBrains Mono", monospace; }
.ch-cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }

  const QUICK_ADD = ["Leg extension", "Chin-up", "Triceps pushdown", "Romanian deadlift", "Incline DB press", "Low-to-high cable fly"];
  const STATUS_LABEL = { today: "Today", upcoming: "Upcoming", complete: "Done", similar: "Similar", partial: "Partial", missed: "Missed", open: "Open" };
  const STATUS_TONE = { today: "neutral", upcoming: "neutral", complete: "good", similar: "good", partial: "warn", missed: "bad", open: "warn" };

  function initialState() { return {
    tab: "today",
    items: TODAY.items.map(it => ({ ...it })),
    addingExercise: false,
    logs: {},
    weekView: "this",
    progressMove: Object.keys(PROGRESS_DATA)[0] || null,
    comments: {},
    commentDraftFor: null,
    exerciseFeedback: {},
    feedbackActive: false,
    fbTarget: null,
    fbStep: 0,
    feedback: {
      difficulty: { pick: null, note: "" }, pain: { pick: null, note: "" },
      repeat: { pick: null, note: "" }, length: { pick: null, note: "" },
    },
    todayLogged: false,
    // setup wizard state (unchanged)
    step: 0,
    days: 4,
    sameLength: true,
    minutesPerDay: [60, 60, 60, 60],
    split: { lifting: 2, cardio: 1, mixed: 1 },
    coachingStyles: ["The Protocol Stack", "Joint Armor"],
    hasExisting: true,
    editing: false,
    saved: false,
    saving: false,
    canSave: false,
  }; }

  const ref = null;

  function clampDays(n) { return Math.min(MAX_DAYS, Math.max(MIN_DAYS, n)); }
  function ensureMinutesLength() {
    const n = state.days || 0;
    const cur = state.minutesPerDay;
    const fill = cur.length ? cur[cur.length - 1] : 45;
    while (cur.length < n) cur.push(fill);
    cur.length = n;
    if (state.sameLength && n) { const v = cur[0]; for (let i = 0; i < n; i++) cur[i] = v; }
  }
  function splitTotal() { return state.split.lifting + state.split.cardio + state.split.mixed; }
  function fmtMinutes(m) {
    if (m % 60 === 0 && m >= 60) return (m / 60) + (m === 60 ? " hour" : " hours");
    if (m > 60) return (Math.floor(m / 60)) + "h " + (m % 60) + "m";
    return m + " min";
  }
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

  function parseSet(s) {
    const m = String(s).match(/^(\d+)×(\d+)(?:-(\d+))?(?: @ (\+?)(\d+))?/);
    if (!m) return null;
    return { sets: +m[1], reps: +(m[3] || m[2]), plus: m[4] === "+", lb: m[5] ? +m[5] : null };
  }
  function getLog(it) {
    if (!state.logs[it.name]) {
      const p = parseSet(it.set);
      state.logs[it.name] = p
        ? Array.from({ length: p.sets }, () => ({ reps: p.reps, lb: p.lb, done: false }))
        : [{ reps: "", lb: "", done: false }];
    }
    return state.logs[it.name];
  }

  function currentFbSteps() { return state.fbTarget ? EXERCISE_FB_STEPS : SESSION_FB_STEPS; }
  function currentAnswers() {
    if (!state.fbTarget) return state.feedback;
    if (!state.exerciseFeedback[state.fbTarget]) {
      state.exerciseFeedback[state.fbTarget] = {
        difficulty: { pick: null, note: "" }, pain: { pick: null, note: "" }, repeat: { pick: null, note: "" },
      };
    }
    return state.exerciseFeedback[state.fbTarget];
  }

  // =========================== ROOT RENDER ===========================
  function render() {
    const device = document.getElementById("device");
    device.innerHTML = "";
    if (state.feedbackActive) {
      device.appendChild(fbTop());
      device.appendChild(bodyWrap(fbStepContent()));
      device.appendChild(fbFooter());
      return;
    }
    device.appendChild(appTop());
    if (state.tab === "today") device.appendChild(bodyWrap(todayContent()));
    else if (state.tab === "week") device.appendChild(bodyWrap(weekContent()));
    else if (state.tab === "progress") device.appendChild(bodyWrap(progressContent()));
    else device.appendChild(bodyWrap(setupContent()));
    device.appendChild(tabBar());
  }

  function bodyWrap(children) {
    const body = el('<div class="screen-body"></div>');
    children.forEach(c => body.appendChild(c));
    return body;
  }
  function sectionHead(eyebrow, title, sub) {
    const nodes = [];
    nodes.push(Object.assign(el('<div class="eyebrow"></div>'), { textContent: eyebrow }));
    nodes.push(Object.assign(el("<h2></h2>"), { textContent: title }));
    if (sub) nodes.push(Object.assign(el('<p class="sub"></p>'), { textContent: sub }));
    return nodes;
  }

  // =========================== APP CHROME ===========================
  function appTop() {
    const top = el('<div class="screen-top"></div>');
    const row = el('<div class="toprow"></div>');
    row.appendChild(el('<div class="brand">TRAIN<span class="dot">.</span>SETUP</div>'));
    row.appendChild(Object.assign(el('<div class="step-tag mono"></div>'), { textContent: UPDATED ? "UPDATED " + UPDATED.toUpperCase() : "" }));
    top.appendChild(row);
    return top;
  }

  function tabBar() {
    const bar = el('<div class="tab-bar"></div>');
    [["today", "▣", "TODAY"], ["week", "⌗", "WEEK"], ["progress", "↗", "PROGRESS"], ["setup", "⚙", "SETUP"]].forEach(([key, mark, label]) => {
      const b = el("<button type=\"button\"></button>");
      if (state.tab === key) b.classList.add("active");
      b.appendChild(Object.assign(el('<div class="mark2"></div>'), { textContent: mark }));
      b.appendChild(Object.assign(el('<div class="lbl"></div>'), { textContent: label }));
      b.addEventListener("click", () => { state.tab = key; render(); });
      bar.appendChild(b);
    });
    return bar;
  }

  // =========================== TODAY ===========================
  function todayContent() {
    const nodes = [];
    nodes.push(Object.assign(el('<div class="eyebrow"></div>'), { textContent: TODAY.weekday.toUpperCase() }));
    nodes.push(Object.assign(el("<h2></h2>"), { textContent: TODAY.title }));
    const band = TODAY.readiness.band;
    const readTag = el('<div class="tag"></div>');
    readTag.classList.add({ green: "good", yellow: "warn", red: "bad" }[band] || "neutral");
    readTag.textContent = band ? "READINESS " + band.toUpperCase() + " · " + TODAY.readiness.score : "NO READINESS SCORE YET";
    nodes.push(readTag);
    if (TODAY.headline) nodes.push(Object.assign(el('<p class="sub"></p>'), { textContent: TODAY.headline }));

    if (TODAY.coachNote) {
      const note = el('<div class="coach-note"></div>');
      note.appendChild(Object.assign(el('<div class="k"></div>'), { textContent: "COACH NOTE" }));
      note.appendChild(Object.assign(el('<div class="v"></div>'), { textContent: TODAY.coachNote }));
      nodes.push(note);
    }

    const list = el('<div class="exercise-list"></div>');
    state.items.forEach((it, i) => {
      list.appendChild(exerciseRow(it, i));
    });
    nodes.push(list);

    const extras = state.coachingStyles.flatMap(style => (STYLE_EXTRAS[style] || []).map(x => ({ ...x, style })))
      .filter(x => !state.items.some(it => it.name === x.name));
    if (extras.length) {
      nodes.push(Object.assign(el('<div class="eyebrow"></div>'), { textContent: "From your coaching style" }));
      extras.forEach(x => {
        const r = el('<div class="style-row"></div>');
        const body = el('<div class="body"></div>');
        body.appendChild(Object.assign(el('<div class="src"></div>'), { textContent: x.style.toUpperCase() }));
        body.appendChild(Object.assign(el('<div class="n"></div>'), { textContent: x.name }));
        body.appendChild(Object.assign(el('<div class="w"></div>'), { textContent: x.why }));
        const add = el('<button type="button" class="exbtn add">+ ADD TO TODAY</button>');
        add.addEventListener("click", () => { state.items.push({ name: x.name, set: x.set }); render(); });
        body.appendChild(add);
        r.appendChild(body);
        r.appendChild(Object.assign(el('<div class="s"></div>'), { textContent: x.set }));
        nodes.push(r);
      });
    }

    nodes.push(addExercisePanel());

    if (state.todayLogged) {
      const strip = el('<div class="logged-strip"></div>');
      const f = state.feedback;
      [f.difficulty.pick, f.pain.pick, f.repeat.pick, f.length.pick].filter(Boolean).forEach(v => {
        strip.appendChild(Object.assign(el('<div class="logged-chip"></div>'), { textContent: v }));
      });
      nodes.push(strip);
      const cta = el('<button class="cta done-cta" type="button">✓ LOGGED — EDIT FEEDBACK</button>');
      cta.addEventListener("click", () => startFeedback());
      nodes.push(cta);
    } else {
      const cta = el('<button class="cta" type="button">FINISH WORKOUT →</button>');
      cta.addEventListener("click", () => startFeedback());
      nodes.push(cta);
    }
    return nodes;
  }

  function exerciseRow(it, i) {
    const row = el('<div class="exercise-row"></div>');
    const main = el('<div class="ex-main"></div>');
    main.appendChild(Object.assign(el('<div class="idx mono"></div>'), { textContent: String(i + 1).padStart(2, "0") }));
    main.appendChild(Object.assign(el('<div class="name"></div>'), { textContent: it.name }));
    main.appendChild(Object.assign(el('<div class="set mono"></div>'), { textContent: it.set }));
    row.appendChild(main);

    const log = state.logs[it.name];
    const doneCount = log ? log.filter(s => s.done).length : 0;
    if (doneCount) {
      row.appendChild(Object.assign(el('<div class="set-count"></div>'), { textContent: "✓ " + doneCount + " / " + log.length + " SETS LOGGED" }));
    }

    row.appendChild(setTable(it));

    const fb = state.exerciseFeedback[it.name];
    if (fb && fb.difficulty.pick) {
      const tagRow = el('<div style="display:flex;gap:6px;flex-wrap:wrap"></div>');
      [fb.difficulty.pick, fb.pain.pick, fb.repeat.pick].filter(Boolean).forEach(v => {
        tagRow.appendChild(Object.assign(el('<div class="logged-chip"></div>'), { textContent: v }));
      });
      row.appendChild(tagRow);
    }

    if (state.commentDraftFor === it.name) {
      const editor = el('<div class="comment-editor"></div>');
      const ta = el('<textarea placeholder="How did this lift feel? Shows up in next Monday\'s review."></textarea>');
      ta.value = state.comments[it.name] || "";
      editor.appendChild(ta);
      const row2 = el('<div class="row2"></div>');
      const cancel = el('<button type="button" class="cancel">CANCEL</button>');
      const save = el('<button type="button" class="save">SAVE NOTE</button>');
      cancel.addEventListener("click", () => { state.commentDraftFor = null; render(); });
      save.addEventListener("click", () => {
        const v = ta.value.trim();
        if (v) state.comments[it.name] = v; else delete state.comments[it.name];
        state.commentDraftFor = null; render();
      });
      row2.appendChild(cancel); row2.appendChild(save);
      editor.appendChild(row2);
      row.appendChild(editor);
    } else if (state.comments[it.name]) {
      const note = el('<div class="ex-note"></div>');
      note.appendChild(el('<span class="hint">NOTE FOR NEXT WEEK</span>'));
      note.appendChild(document.createTextNode("“" + state.comments[it.name] + "”"));
      row.appendChild(note);
    }

    const actions = el('<div class="ex-actions"></div>');
    const noteBtn = el('<button type="button" class="exbtn">NOTE</button>');
    if (state.comments[it.name]) noteBtn.classList.add("on");
    noteBtn.addEventListener("click", () => { state.commentDraftFor = state.commentDraftFor === it.name ? null : it.name; render(); });
    const rateBtn = el('<button type="button" class="exbtn">RATE</button>');
    if (fb && fb.difficulty.pick) rateBtn.classList.add("on");
    rateBtn.addEventListener("click", () => startFeedback(it.name));
    const rm = el('<button type="button" class="rm">✕</button>');
    rm.addEventListener("click", () => { state.items.splice(i, 1); render(); });
    actions.appendChild(noteBtn); actions.appendChild(rateBtn); actions.appendChild(rm);
    row.appendChild(actions);
    return row;
  }

  function setTable(it) {
    const log = getLog(it);
    const plus = (parseSet(it.set) || {}).plus;
    const table = el('<div class="set-table"></div>');
    if (log.length) {
      const h = el('<div class="set-row set-head"></div>');
      [["SET", "sn"], ["REPS", "hc"], ["", "x"], [plus ? "+ LB" : "LB", "hc"]].forEach(([t, c]) => h.appendChild(Object.assign(el('<span></span>'), { className: c, textContent: t })));
      table.appendChild(h);
    }
    log.forEach((s, n) => {
      const r = el('<div class="set-row"></div>');
      r.appendChild(Object.assign(el('<div class="sn"></div>'), { textContent: String(n + 1) }));
      const reps = el('<input type="number" inputmode="numeric" min="0" aria-label="Reps">');
      reps.value = s.reps;
      reps.addEventListener("input", () => { s.reps = reps.value; });
      r.appendChild(reps);
      r.appendChild(Object.assign(el('<span class="x"></span>'), { textContent: "×" }));
      const lb = el('<input type="number" inputmode="decimal" min="0" aria-label="Weight">');
      lb.value = s.lb == null ? "" : s.lb;
      lb.addEventListener("input", () => { s.lb = lb.value; });
      r.appendChild(lb);
      const done = el('<button type="button" class="done" aria-label="Mark set done">✓</button>');
      if (s.done) done.classList.add("on");
      done.addEventListener("click", () => { s.done = !s.done; render(); });
      r.appendChild(done);
      const rm = el('<button type="button" class="rmset" aria-label="Remove set">−</button>');
      rm.addEventListener("click", () => { log.splice(n, 1); render(); });
      r.appendChild(rm);
      table.appendChild(r);
    });
    const add = el('<button type="button" class="add-set">+ ADD SET</button>');
    add.addEventListener("click", () => {
      const prev = log[log.length - 1];
      log.push({ reps: prev ? prev.reps : "", lb: prev ? prev.lb : "", done: false });
      render();
    });
    table.appendChild(add);
    return table;
  }

  function addExercisePanel() {
    if (!state.addingExercise) {
      const row = el('<button type="button" class="add-row">+ ADD OR CREATE AN EXERCISE</button>');
      row.addEventListener("click", () => { state.addingExercise = true; render(); });
      return row;
    }
    const panel = el('<div class="add-panel"></div>');
    const available = QUICK_ADD.filter(n => !state.items.some(it => it.name === n));
    if (available.length) {
      panel.appendChild(Object.assign(el('<div class="lbl"></div>'), { textContent: "QUICK ADD" }));
      const chips = el('<div class="quick-chips"></div>');
      available.forEach(name => {
        const chip = el('<button type="button" class="quick-chip"></button>');
        chip.textContent = "+ " + name;
        chip.addEventListener("click", () => { state.items.push({ name, set: "3×10" }); render(); });
        chips.appendChild(chip);
      });
      panel.appendChild(chips);
    }
    panel.appendChild(Object.assign(el('<div class="lbl"></div>'), { textContent: "OR CREATE A NEW ONE" }));
    const createRow = el('<div class="create-row"></div>');
    const input = el('<input type="text" placeholder="Exercise name">');
    const addBtn = el('<button type="button">ADD</button>');
    function commit() {
      const name = input.value.trim();
      if (!name) return;
      state.items.push({ name, set: "— × —" });
      render();
    }
    addBtn.addEventListener("click", commit);
    input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
    createRow.appendChild(input); createRow.appendChild(addBtn);
    panel.appendChild(createRow);
    const done = el('<button type="button" class="ghost" style="padding:10px">DONE</button>');
    done.addEventListener("click", () => { state.addingExercise = false; render(); });
    panel.appendChild(done);
    return panel;
  }

  function startFeedback(exerciseName) {
    state.fbTarget = exerciseName || null;
    state.feedbackActive = true;
    state.fbStep = 0;
    render();
  }

  // =========================== WEEK ===========================
  function weekToggle() {
    const seg = el('<div class="seg"></div>');
    [["this", "THIS WEEK"], ["next", "NEXT WEEK"]].forEach(([key, label]) => {
      const b = el('<button type="button"></button>');
      b.textContent = label;
      b.classList.toggle("active", state.weekView === key);
      b.addEventListener("click", () => { state.weekView = key; render(); });
      seg.appendChild(b);
    });
    return seg;
  }

  function nextWeekChanges() {
    return state.items.map(it => {
      const fb = state.exerciseFeedback[it.name];
      const log = state.logs[it.name];
      const note = state.comments[it.name];
      const p = parseSet(it.set);
      const shift = d => (p && p.lb != null) ? it.set.replace(/(@ \+?)(\d+)/, (_, a, b) => a + (+b + d)) : it.set;
      const said = n => n ? " You wrote: “" + n + "”" : "";
      if (fb && fb.pain.pick === "Sharp or joint pain")
        return { name: it.name, kind: "swap", label: "SWAP", to: (SWAPS[it.name] || "Joint-friendly alternative") + " · " + it.set.replace(/ @ .*/, ""),
          why: "You flagged sharp or joint pain, so it's swapped for a version easier on the joint." + said(fb.pain.note) };
      if (fb && fb.repeat.pick === "Rather not")
        return { name: it.name, kind: "swap", label: "SWAP", to: (SWAPS[it.name] || "Alternative") + " · " + it.set.replace(/ @ .*/, ""),
          why: "You said you'd rather not run it again." + said(fb.repeat.note) };
      if (fb && fb.difficulty.pick === "Too easy")
        return { name: it.name, kind: "good", label: "+5 LB", to: shift(5), why: "You rated it too easy, so the weight goes up." + said(fb.difficulty.note) };
      if (fb && fb.difficulty.pick === "Too hard")
        return { name: it.name, kind: "warn", label: "−5 LB", to: shift(-5), why: "You rated it too hard, so it drops until every rep is clean again." + said(fb.difficulty.note) };
      if (log && log.length && log.every(s => s.done))
        return { name: it.name, kind: "good", label: "+5 LB", to: shift(5), why: "Every set was logged as done, so it gets the standard +5 lb." };
      if (note)
        return { name: it.name, kind: "neutral", label: "REVIEW", to: it.set, why: "Holds for now. Monday's review reads your note: “" + note + "”" };
      return { name: it.name, kind: "neutral", label: "HOLD", to: it.set, why: "No feedback yet, so it stays as written." };
    });
  }

  function nextWeekContent() {
    const nodes = sectionHead("Next week", "What your feedback changed", "Every change comes from something you logged, rated, or wrote this week.");
    nodes.push(weekToggle());
    nextWeekChanges().forEach(c => {
      const card = el('<div class="change-card"></div>');
      const top = el('<div class="change-top"></div>');
      top.appendChild(Object.assign(el('<div class="change-name"></div>'), { textContent: c.name }));
      const tag = el('<div class="tag"></div>');
      tag.classList.add(c.kind);
      tag.textContent = c.label;
      top.appendChild(tag);
      card.appendChild(top);
      const from = el('<div class="change-from"></div>');
      const cur = state.items.find(it => it.name === c.name).set;
      if (c.to === cur) from.textContent = cur;
      else { from.textContent = cur + " → "; from.appendChild(Object.assign(document.createElement("b"), { textContent: c.to })); }
      card.appendChild(from);
      card.appendChild(Object.assign(el('<div class="change-why"></div>'), { textContent: c.why }));
      nodes.push(card);
    });
    return nodes;
  }

  function weekContent() {
    if (state.weekView === "next") return nextWeekContent();
    const nodes = sectionHead("This week", "Mon – Sun", "Numbered slots load straight into Hevy; this week's plan stays fixed once Monday's review has run.");
    nodes.push(weekToggle());
    const list = el('<div style="display:flex;flex-direction:column;gap:8px"></div>');
    WEEK.forEach(day => {
      const row = el('<div class="week-row"></div>');
      if (day.status === "today") row.classList.add("today");
      const d = el('<div class="d"></div>');
      d.appendChild(Object.assign(el('<div class="wd"></div>'), { textContent: day.wd }));
      d.appendChild(Object.assign(el('<div class="num mono"></div>'), { textContent: day.num }));
      row.appendChild(d);
      row.appendChild(Object.assign(el('<div class="t"></div>'), { textContent: day.t }));
      const tag = el('<div class="tag"></div>');
      tag.classList.add(STATUS_TONE[day.status] || "neutral");
      tag.textContent = STATUS_LABEL[day.status] || day.status;
      row.appendChild(tag);
      list.appendChild(row);
    });
    nodes.push(list);
    return nodes;
  }

  // =========================== PROGRESS ===========================
  function progressContent() {
    const nodes = sectionHead("Progress", "Strength over time", "Your heaviest working set each week, from Hevy. Dumbbells show both hands combined.");
    if (!state.progressMove) {
      nodes.push(Object.assign(el('<p class="sub"></p>'), { textContent: "No lift has two or more weeks of history yet. Log a few sessions and this fills in." }));
      return nodes;
    }
    const pick = el('<label class="move-pick"><span>MOVEMENT</span></label>');
    const sel = el('<select id="progress-move"></select>');
    Object.keys(PROGRESS_DATA).forEach(name => {
      const o = document.createElement("option");
      o.value = name; o.textContent = name;
      if (state.progressMove === name) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", () => { state.progressMove = sel.value; render(); });
    pick.appendChild(sel);
    nodes.push(pick);

    const { labels, vals } = PROGRESS_DATA[state.progressMove];
    const first = vals[0], last = vals[vals.length - 1], best = Math.max(...vals);
    const card = el('<div class="chart-card"></div>');
    const head = el('<div class="chart-head"></div>');
    const left = el('<div></div>');
    left.appendChild(Object.assign(el('<div class="k"></div>'), { textContent: state.progressMove.toUpperCase() }));
    const big = el('<div class="big"></div>');
    big.textContent = last + " ";
    big.appendChild(Object.assign(document.createElement("small"), { textContent: "lb" }));
    left.appendChild(big);
    head.appendChild(left);
    head.appendChild(Object.assign(el('<div class="delta"></div>'), { textContent: (last - first >= 0 ? "+" : "−") + Math.abs(last - first) + " lb since " + labels[0] }));
    card.appendChild(head);
    card.appendChild(lineChart(vals, card, labels));
    nodes.push(card);

    const rows = el('<div></div>');
    rows.appendChild(summaryRow("Best", best + " lb (" + labels[vals.indexOf(best)] + ")"));
    rows.appendChild(summaryRow("Started at", first + " lb (" + labels[0] + ")"));
    rows.appendChild(summaryRow("Weeks logged", vals.length));
    nodes.push(rows);
    return nodes;
  }

  function lineChart(vals, card, labels) {
    const W = 340, H = 170, pl = 34, pr = 38, pt = 12, pb = 24;
    const lo = Math.floor((Math.min(...vals) - 10) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 5) / 5) * 5;
    const x = i => pl + i * (W - pl - pr) / (vals.length - 1);
    const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
    const mid = Math.round((lo + hi) / 2 / 5) * 5;
    const pts = vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1));
    const n = vals.length - 1;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + state.progressMove + ' weight by week">';
    [lo, mid, hi].forEach(t => {
      s += '<line class="ch-grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>';
      s += '<text class="ch-lbl" x="' + (pl - 6) + '" y="' + (y(t) + 3) + '" text-anchor="end">' + t + '</text>';
    });
    [...new Set([0, Math.round(n / 2), n])].forEach(i => {
      s += '<text class="ch-lbl" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (i === 0 ? "start" : i === n ? "end" : "middle") + '">' + labels[i] + '</text>';
    });
    s += '<polygon class="ch-area" points="' + x(0) + ',' + y(lo) + ' ' + pts.join(" ") + ' ' + x(n) + ',' + y(lo) + '"/>';
    s += '<polyline class="ch-line" points="' + pts.join(" ") + '"/>';
    vals.forEach((v, i) => { s += '<circle class="ch-pt" cx="' + x(i) + '" cy="' + y(v) + '" r="' + (i === n ? 5 : 4) + '"/>'; });
    s += '<text class="ch-end" x="' + (x(n) + 9) + '" y="' + (y(vals[n]) + 4) + '">' + vals[n] + '</text>';
    s += '<line class="ch-cross" id="cross" y1="' + pt + '" y2="' + (H - pb) + '" visibility="hidden"/>';
    s += '</svg>';
    const wrap = el('<div></div>');
    wrap.innerHTML = s;
    const svg = wrap.firstElementChild;
    const tip = el('<div class="tip" hidden></div>');
    card.appendChild(tip);
    const cross = svg.querySelector("#cross");
    svg.addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect();
      const sx = (e.clientX - r.left) * W / r.width;
      const i = Math.max(0, Math.min(n, Math.round((sx - pl) / ((W - pl - pr) / n))));
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      const scale = r.width / W, cr = card.getBoundingClientRect();
      tip.style.left = (r.left - cr.left + x(i) * scale) + "px";
      tip.style.top = (r.top - cr.top + y(vals[i]) * scale) + "px";
      tip.textContent = labels[i] + " · " + vals[i] + " lb";
      tip.hidden = false;
    });
    svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
    return svg;
  }

  // =========================== FEEDBACK FLOW ===========================
  function fbTop() {
    const steps = currentFbSteps();
    const top = el('<div class="screen-top"></div>');
    const row = el('<div class="toprow"></div>');
    row.appendChild(Object.assign(el('<div class="step-tag mono"></div>'), { textContent: "0" + (state.fbStep + 1) + " / 0" + steps.length }));
    const x = el('<button class="close-x" type="button">✕</button>');
    x.addEventListener("click", () => { state.feedbackActive = false; state.fbTarget = null; render(); });
    row.appendChild(x);
    top.appendChild(row);
    const bar = el('<div class="progress"></div>');
    steps.forEach((s, i) => { const dot = el("<i></i>"); if (i <= state.fbStep) dot.classList.add("done"); bar.appendChild(dot); });
    top.appendChild(bar);
    return top;
  }

  const FB_DEFS = {
    difficulty: { eyebrow: "After today's session", title: "How did it feel?", sub: "This decides next week's weights — be honest.",
      options: [["Too easy", "Every set felt light"], ["About right", "Hard, but doable"], ["Too hard", "Couldn't finish as written"]] },
    pain: { eyebrow: "Checking in", title: "Any pain?", sub: "These mean different things, so they get different answers.",
      options: [["None", "Nothing to report"], ["Muscle soreness", "Normal, expected soreness"], ["Sharp or joint pain", "Flags it for review"]] },
    repeat: { eyebrow: "One more thing", title: "Want this one again?", sub: "Your pick here shapes whether it comes back next cycle.",
      options: [["Yes, run it again", "Keep this session as-is"], ["Rather not", "Swap it for something else"]] },
    length: { eyebrow: "Last one", title: "How was the length?", sub: "Session length, not difficulty.",
      options: [["Too short", "Could've done more"], ["Just right", "Good as scheduled"], ["Too long", "Ran over what you wanted"]] },
  };

  function fbStepContent() {
    const key = currentFbSteps()[state.fbStep];
    const def = FB_DEFS[key];
    const eyebrow = key === "difficulty" && state.fbTarget ? "Rating " + state.fbTarget : def.eyebrow;
    const answers = currentAnswers();
    const nodes = sectionHead(eyebrow, def.title, def.sub);
    const list = el('<div class="choice-list"></div>');
    def.options.forEach(([label, hint]) => {
      const card = el('<button type="button" class="choice-card"></button>');
      if (answers[key].pick === label) card.classList.add("selected");
      const left = el('<div></div>');
      left.appendChild(Object.assign(el('<div class="t"></div>'), { textContent: label }));
      left.appendChild(Object.assign(el('<div class="h"></div>'), { textContent: hint }));
      card.appendChild(left);
      card.appendChild(el('<div class="mark"></div>'));
      card.addEventListener("click", () => { answers[key].pick = label; render(); });
      list.appendChild(card);
    });
    nodes.push(list);
    nodes.push(plainLanguageField(key, answers));
    return nodes;
  }

  function plainLanguageField(key, answers) {
    const wrap = el('<div class="note-field"></div>');
    wrap.appendChild(Object.assign(el('<div class="lbl"></div>'), { textContent: "OR, IN PLAIN LANGUAGE (OPTIONAL)" }));
    const ta = el('<textarea placeholder="Say it however you\'d actually say it..."></textarea>');
    ta.value = answers[key].note || "";
    ta.addEventListener("input", () => { answers[key].note = ta.value; });
    wrap.appendChild(ta);
    return wrap;
  }

  function fbFooter() {
    const steps = currentFbSteps();
    const footer = el('<div class="screen-footer"></div>');
    const key = steps[state.fbStep];
    const answered = !!currentAnswers()[key].pick;
    if (state.fbStep > 0) {
      const back = el('<button class="ghost" type="button">BACK</button>');
      back.addEventListener("click", () => { state.fbStep -= 1; render(); });
      footer.appendChild(back);
    }
    const next = el('<button class="primary" type="button"></button>');
    const isLast = state.fbStep === steps.length - 1;
    next.textContent = isLast ? "LOG IT" : "NEXT";
    next.disabled = !answered;
    next.addEventListener("click", () => {
      if (isLast) {
        if (!state.fbTarget) state.todayLogged = true;
        state.feedbackActive = false; state.fbTarget = null; state.tab = "today"; render();
      } else { state.fbStep += 1; render(); }
    });
    footer.appendChild(next);
    return footer;
  }

  // =========================== SETUP (unchanged wizard, nested under its own tab) ===========================
  function setupContent() {
    if (state.saved) return doneScreenContent();
    if (state.hasExisting && !state.editing) return existingSummaryContent();
    return wizardStepContent();
  }

  function wizardStepContent() {
    const name = WIZ_STEPS[state.step];
    let nodes;
    if (name === "days") nodes = daysStep();
    else if (name === "length") nodes = lengthStep();
    else if (name === "split") nodes = splitStep();
    else if (name === "coaching") nodes = coachingStep();
    else nodes = reviewStep();
    nodes.push(wizardNav(name));
    return nodes;
  }

  function wizardNav(name) {
    const nav = el('<div class="inline-nav"></div>');
    if (name === "review") {
      const back = el('<button class="ghost" type="button">BACK</button>');
      back.addEventListener("click", () => { state.step = 3; render(); });
      const saveBtn = el('<button class="primary" type="button"></button>');
      saveBtn.textContent = state.saving ? "SAVING…" : (state.canSave === false ? "SAVING ISN'T WIRED UP YET" : (state.editing ? "SAVE CHANGES" : "SAVE MY PLAN"));
      saveBtn.disabled = state.saving || state.canSave === false;
      saveBtn.addEventListener("click", saveWizard);
      nav.appendChild(back); nav.appendChild(saveBtn);
      return nav;
    }
    const valid = name === "days" ? state.days != null
      : name === "length" ? (state.minutesPerDay.length === state.days && state.minutesPerDay.every(m => m > 0))
      : name === "split" ? state.days - splitTotal() === 0
      : state.coachingStyles.length > 0;
    if (state.step > 0) {
      const back = el('<button class="ghost" type="button">BACK</button>');
      back.addEventListener("click", () => { state.step -= 1; render(); });
      nav.appendChild(back);
    }
    const next = el('<button class="primary" type="button">NEXT</button>');
    next.disabled = !valid;
    next.addEventListener("click", () => { state.step += 1; render(); });
    nav.appendChild(next);
    return nav;
  }

  function daysStep() {
    const nodes = sectionHead("Step 1 of 4", "How many days a week do you want to train?", "Pick the number of days on your schedule. You can change this later.");
    const row = el('<div class="chip-row"></div>');
    for (let n = MIN_DAYS; n <= MAX_DAYS; n++) {
      const chip = el("<button class=\"chip\" type=\"button\"></button>");
      chip.textContent = n;
      if (state.days === n) chip.classList.add("selected");
      chip.addEventListener("click", () => { state.days = n; ensureMinutesLength(); clampSplitToDays(); render(); });
      row.appendChild(chip);
    }
    nodes.push(row);
    return nodes;
  }

  function lengthStep() {
    const nodes = sectionHead("Step 2 of 4", "How long do you want your workouts to be?", "One length for every day, or set each day separately.");
    const seg = el('<div class="seg"></div>');
    const sameBtn = el('<button type="button">SAME EVERY DAY</button>');
    const diffBtn = el('<button type="button">DIFFERENT PER DAY</button>');
    sameBtn.classList.toggle("active", state.sameLength);
    diffBtn.classList.toggle("active", !state.sameLength);
    sameBtn.addEventListener("click", () => { state.sameLength = true; ensureMinutesLength(); render(); });
    diffBtn.addEventListener("click", () => { state.sameLength = false; render(); });
    seg.appendChild(sameBtn); seg.appendChild(diffBtn);
    nodes.push(seg);
    const rows = el('<div style="display:flex;flex-direction:column;gap:10px"></div>');
    const dayCount = state.sameLength ? 1 : state.days;
    for (let i = 0; i < dayCount; i++) rows.appendChild(durationRow(state.sameLength ? "ALL DAYS" : "DAY " + (i + 1), i));
    nodes.push(rows);
    return nodes;
  }

  function durationRow(label, idx) {
    const row = el('<div class="day-row"></div>');
    row.appendChild(Object.assign(el('<div class="day-label"></div>'), { textContent: label }));
    const wrap = el('<div class="duration-input"></div>');
    const minutes = state.minutesPerDay[idx] || 45;
    const unit = minutes % 60 === 0 && minutes >= 60 ? "hr" : "min";
    const displayVal = unit === "hr" ? minutes / 60 : minutes;
    const input = el('<input type="number" min="1" step="any" inputmode="decimal">');
    input.value = displayVal;
    const unitSeg = el('<div class="unit-seg"></div>');
    const minBtn = el('<button type="button">MIN</button>');
    const hrBtn = el('<button type="button">HR</button>');
    minBtn.classList.toggle("active", unit === "min");
    hrBtn.classList.toggle("active", unit === "hr");
    function applyAll(newMinutes) {
      if (state.sameLength) { for (let i = 0; i < state.minutesPerDay.length; i++) state.minutesPerDay[i] = newMinutes; }
      else state.minutesPerDay[idx] = newMinutes;
    }
    function currentUnit() { return unitSeg.querySelector(".active") === hrBtn ? "hr" : "min"; }
    input.addEventListener("input", () => {
      const raw = parseFloat(input.value);
      if (!isFinite(raw) || raw <= 0) return;
      applyAll(Math.round(currentUnit() === "hr" ? raw * 60 : raw));
    });
    minBtn.addEventListener("click", () => { if (currentUnit() === "min") return; minBtn.classList.add("active"); hrBtn.classList.remove("active"); input.value = state.minutesPerDay[idx] || 45; });
    hrBtn.addEventListener("click", () => { if (currentUnit() === "hr") return; hrBtn.classList.add("active"); minBtn.classList.remove("active"); const m = state.minutesPerDay[idx] || 45; input.value = Math.round((m / 60) * 100) / 100; });
    unitSeg.appendChild(minBtn); unitSeg.appendChild(hrBtn);
    wrap.appendChild(input); wrap.appendChild(unitSeg);
    row.appendChild(wrap);
    return row;
  }

  function clampSplitToDays() {
    const n = state.days || 0;
    for (const k of ["mixed", "cardio", "lifting"]) while (splitTotal() > n && state.split[k] > 0) state.split[k]--;
  }

  function splitStep() {
    const nodes = sectionHead("Step 3 of 4", "What kind of days are those?", "Out of your " + state.days + " training day" + (state.days === 1 ? "" : "s") + ", how many are lifting, cardio, or mixed?");
    const list = el('<div></div>');
    [["lifting", "Lifting", "Strength-focused sessions"], ["cardio", "Cardio", "Running, biking, rowing, etc."], ["mixed", "Mixed", "Both in one session"]]
      .forEach(([key, name, hint]) => list.appendChild(splitRow(key, name, hint)));
    nodes.push(list);
    const remaining = state.days - splitTotal();
    const tally = el('<div class="tally"></div>');
    tally.classList.add(remaining === 0 ? "ok" : "off");
    tally.innerHTML = '<span>' + splitTotal() + ' / ' + state.days + ' DAYS ASSIGNED</span><span>' + (remaining === 0 ? "ALL SET" : remaining + " LEFT") + '</span>';
    nodes.push(tally);
    return nodes;
  }

  function coachingStep() {
    const nodes = sectionHead("Step 4 of 4", "Pick your coaching style", "Pick as many as you want — the plan blends whichever styles you choose.");
    const list = el('<div class="choice-list"></div>');
    COACHING_STYLES.forEach(style => {
      const card = el('<button type="button" class="choice-card"></button>');
      const isSel = state.coachingStyles.includes(style.name);
      if (isSel) card.classList.add("selected");
      const left = el('<div></div>');
      left.appendChild(Object.assign(el('<div class="t"></div>'), { textContent: style.name }));
      left.appendChild(Object.assign(el('<div class="h who"></div>'), { textContent: "Inspired by " + style.who }));
      left.appendChild(Object.assign(el('<div class="h"></div>'), { textContent: style.hint }));
      card.appendChild(left);
      const mark = el('<div class="mark square"></div>');
      if (isSel) mark.textContent = "✓";
      card.appendChild(mark);
      card.addEventListener("click", () => {
        const i = state.coachingStyles.indexOf(style.name);
        if (i >= 0) state.coachingStyles.splice(i, 1); else state.coachingStyles.push(style.name);
        render();
      });
      list.appendChild(card);
    });
    nodes.push(list);
    return nodes;
  }

  function splitRow(key, name, hint) {
    const row = el('<div class="split-row"></div>');
    const left = el('<div></div>');
    left.appendChild(Object.assign(el('<div class="split-name"></div>'), { textContent: name }));
    left.appendChild(Object.assign(el('<div class="split-hint"></div>'), { textContent: hint }));
    row.appendChild(left);
    const stepper = el('<div class="stepper"></div>');
    const minus = el('<button type="button">−</button>');
    const plus = el('<button type="button">+</button>');
    const n = el('<span class="n tabular"></span>');
    n.textContent = state.split[key];
    minus.disabled = state.split[key] <= 0;
    plus.disabled = splitTotal() >= state.days;
    minus.addEventListener("click", () => { if (state.split[key] > 0) { state.split[key]--; render(); } });
    plus.addEventListener("click", () => { if (splitTotal() < state.days) { state.split[key]++; render(); } });
    stepper.appendChild(minus); stepper.appendChild(n); stepper.appendChild(plus);
    row.appendChild(stepper);
    return row;
  }

  function reviewStep() {
    const nodes = sectionHead("Review", state.editing ? "Update your plan" : "Here's your plan", "Double check these, then save.");
    const rows = el('<div></div>');
    rows.appendChild(summaryRow("Days per week", state.days));
    rows.appendChild(summaryRow("Session length", state.sameLength ? fmtMinutes(state.minutesPerDay[0]) : state.minutesPerDay.map((m, i) => "D" + (i + 1) + " " + fmtMinutes(m)).join(" · ")));
    rows.appendChild(summaryRow("Lifting days", state.split.lifting));
    rows.appendChild(summaryRow("Cardio days", state.split.cardio));
    rows.appendChild(summaryRow("Mixed days", state.split.mixed));
    rows.appendChild(summaryRow("Coaching style", state.coachingStyles.join(" + ") || "None picked"));
    nodes.push(rows);
    return nodes;
  }

  function summaryRow(k, v) {
    const row = el('<div class="summary-row"></div>');
    row.appendChild(Object.assign(el('<div class="k"></div>'), { textContent: k }));
    row.appendChild(Object.assign(el('<div class="v"></div>'), { textContent: v }));
    return row;
  }

  function existingSummaryContent() {
    const nodes = sectionHead("Your setup", "You're all set up", "Come back any time to change these.");
    const rows = el('<div></div>');
    rows.appendChild(summaryRow("Days per week", state.days));
    rows.appendChild(summaryRow("Session length", state.sameLength ? fmtMinutes(state.minutesPerDay[0]) : state.minutesPerDay.map((m, i) => "D" + (i + 1) + " " + fmtMinutes(m)).join(" · ")));
    rows.appendChild(summaryRow("Lifting days", state.split.lifting));
    rows.appendChild(summaryRow("Cardio days", state.split.cardio));
    rows.appendChild(summaryRow("Mixed days", state.split.mixed));
    rows.appendChild(summaryRow("Coaching style", state.coachingStyles.join(" + ") || "None picked"));
    nodes.push(rows);
    const edit = el('<button class="primary" type="button" style="margin-top:4px">CHANGE MY PLAN</button>');
    edit.addEventListener("click", () => { state.editing = true; state.step = 0; render(); });
    nodes.push(edit);
    return nodes;
  }

  function doneScreenContent() {
    const wrap = el('<div class="done-screen"></div>');
    wrap.appendChild(el('<div class="done-mark">✓</div>'));
    wrap.appendChild(Object.assign(el("<h2></h2>"), { textContent: "Saved" }));
    wrap.appendChild(Object.assign(el('<p class="sub"></p>'), { textContent: state.canSave ? "Your plan is saved. Come back any time to change it." : "Noted for this visit — sign in to keep it saved for next time." }));
    const edit = el('<button class="ghost" type="button">CHANGE IT AGAIN</button>');
    edit.addEventListener("click", () => { state.saved = false; state.editing = true; state.step = 0; render(); });
    wrap.appendChild(edit);
    return [wrap];
  }

  async function saveWizard() {
    state.saving = true; render();
    const payload = { days: state.days, sameLength: state.sameLength, minutesPerDay: state.minutesPerDay.slice(), split: { ...state.split }, coachingStyles: state.coachingStyles.slice(), updatedAt: new Date().toISOString() };
    try { if (ref) await ref.set(payload); } catch (e) { console.error("save failed", e); }
    state.saving = false; state.saved = true; state.hasExisting = true;
    render();
  }

  function start(data) {
    fromPayload(data);
    UPDATED = (data.live && data.live.updated) || "";
    state = initialState();
    render();
  }

  // Same lock as the current phone app: the page ships encrypted, and your passphrase decrypts it on the phone.
  const KEY = "recomp-pass";
  const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } },
                  set(v) { try { localStorage.setItem(KEY, v); } catch {} }, clear() { try { localStorage.removeItem(KEY); } catch {} } };
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(enc, pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(enc.iv) }, key, bytes(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function showLock(enc, msg) {
    const device = document.getElementById("device");
    device.innerHTML = "";
    const body = el('<form class="screen-body lock"></form>');
    sectionHead("Recomp", "Unlock your training", "Your data is encrypted. Enter your passphrase to open it.").forEach(n => body.appendChild(n));
    const input = el('<input id="pass" type="password" autocomplete="current-password" required aria-label="Passphrase">');
    body.appendChild(input);
    const rem = el('<label class="rem"><input id="remember" type="checkbox" checked> Remember on this phone</label>');
    body.appendChild(rem);
    const btn = el('<button class="primary" type="submit">UNLOCK</button>');
    body.appendChild(btn);
    if (msg) body.appendChild(Object.assign(el('<p class="sub lock-err" role="alert"></p>'), { textContent: msg }));
    body.addEventListener("submit", async e => {
      e.preventDefault();
      btn.disabled = true; btn.textContent = "UNLOCKING…";
      try {
        const data = await decrypt(enc, input.value);
        if (rem.querySelector("input").checked) store.set(input.value);
        start(data);
      } catch { showLock(enc, "That passphrase didn't work. Check it and try again."); }
    });
    device.appendChild(body);
    input.focus();
  }

  const plain = JSON.parse(document.getElementById("recomp-data").textContent);
  if (plain) start(plain);
  else {
    const enc = JSON.parse(document.getElementById("recomp-enc").textContent);
    const saved = store.get();
    if (saved) decrypt(enc, saved).then(start).catch(() => { store.clear(); showLock(enc); });
    else showLock(enc);
  }
})();
</script>
</body></html>
