<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#14181D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Recomp"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"></head><body><title>Recomp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: masthead + month reasoning, today (live only), four goals, then the month as a
   Mon–Sun grid of compact day tiles with a week label on the left. Tiles show only what you
   need at a glance; the full session and the reasoning open in a panel. Anything with a
   folded corner opens; the corner peels back on hover. Intensity uses bumper-plate colors. */
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --sunk: #EAECEF; --ink: #14181D; --ink-2: #5C6570; --line: #DCE0E5;
  --flap: #E2E6EA; --reveal: #14181D; --reveal-ink: #FFFFFF;
  --heavy: #D23A2E; --volume: #2A62C9; --interval: #D29C00; --legs: #2E8A46; --rest: #A6AEB7;
  --good: #1F7A45; --warn: #A86A12; --bad: #BF3528; --similar: #8ED1A6; --similar-ink: #0E3B21;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --text: "Libre Franklin", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --surface: #1A1E23; --sunk: #15181C; --ink: #ECEFF2; --ink-2: #98A2AD; --line: #2B3138;
  --flap: #2E343B; --reveal: #ECEFF2; --reveal-ink: #111418;
  --heavy: #EC5B4F; --volume: #5E91F2; --interval: #EDBE35; --legs: #52B66B; --rest: #707A85;
  --good: #52C27E; --warn: #E3A53F; --bad: #EF6B5E; --similar: #B5E8C7; --similar-ink: #0E3B21; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1A1E23; --sunk: #15181C; --ink: #ECEFF2; --ink-2: #98A2AD; --line: #2B3138;
  --flap: #2E343B; --reveal: #ECEFF2; --reveal-ink: #111418;
  --heavy: #EC5B4F; --volume: #5E91F2; --interval: #EDBE35; --legs: #52B66B; --rest: #707A85;
  --good: #52C27E; --warn: #E3A53F; --bad: #EF6B5E; --similar: #B5E8C7; --similar-ink: #0E3B21; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--text); font-variant-numeric: tabular-nums; }
.page { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 72px; display: grid; gap: 44px; }
h1, h2 { font-family: var(--display); margin: 0; line-height: .95; text-wrap: balance; }
h2 { font-size: 32px; font-weight: 800; }
h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.25; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.sec { display: grid; gap: 16px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }

/* ---------- anything that opens: a panel with a folded corner that peels on hover ---------- */
.open { position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; border-bottom-right-radius: 0; padding: 14px 16px 18px;
  --fold: 15px; transition: border-color .15s; }
.open::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: var(--fold); height: var(--fold);
  background: linear-gradient(to top left, var(--reveal) 0 50%, var(--flap) 50% 100%);
  box-shadow: -1px -1px 3px color-mix(in srgb, #000 18%, transparent); transition: width .18s ease-out, height .18s ease-out; }
.open::before { content: "Why"; position: absolute; right: 5px; bottom: 4px; z-index: 1; font: 700 11.5px/1 var(--text);
  color: var(--reveal-ink); opacity: 0; transition: opacity .12s; pointer-events: none; }
.open:hover, .open:focus-visible { --fold: 44px; border-color: color-mix(in srgb, var(--ink) 35%, transparent); }
.open:hover::before, .open:focus-visible::before { opacity: 1; transition-delay: .08s; }
.open:focus-visible { outline: 3px solid var(--volume); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .open, .open::after, .open::before { transition: none; } }

/* ---------- masthead ---------- */
.mast { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); gap: 24px 48px; align-items: end; }
.mast h1 { font-size: clamp(76px, 13vw, 160px); font-weight: 900; line-height: .82; letter-spacing: -.005em; }
.mast .lede { max-width: 56ch; margin-top: 16px; font-size: 17px; }
.monthwhy h3 { font-size: 18px; margin-bottom: 6px; }
.monthwhy p { font-size: 14px; color: var(--ink-2); }

/* ---------- intensity ---------- */
.k-heavy { --c: var(--heavy); } .k-volume { --c: var(--volume); } .k-interval { --c: var(--interval); }
.k-legs { --c: var(--legs); } .k-rest { --c: var(--rest); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 5px; border-radius: 2px; background: var(--c); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; line-height: 1.5;
  background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent); }

/* ---------- today ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px 36px; border-top: 5px solid var(--c); padding: 18px 20px 24px; }
.today .when { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-weight: 600; margin-bottom: 8px; }
.today h2 { font-size: 40px; }
.today ol { margin: 14px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.today .side { display: grid; gap: 10px; align-content: start; font-size: 14px; }
.band { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--bc); }
.band.green { --bc: var(--good); } .band.yellow { --bc: var(--warn); } .band.red { --bc: var(--bad); } .band.none { --bc: var(--ink-2); }

/* ---------- goals ---------- */
.goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.goal { display: grid; gap: 6px; align-content: start; }
.goal .target { font-size: 14px; font-weight: 500; }
.goal .base { font-size: 13px; color: var(--ink-2); }
.goal .status { font-size: 13px; font-weight: 600; margin-top: 4px; }
.ticks { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.ticks i { width: 8px; height: 12px; border-radius: 2px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.ticks i.on { background: var(--ink); box-shadow: none; }
.ticks i.bad { background: var(--bad); box-shadow: none; }
.ticks i.mark { box-shadow: inset 0 0 0 1.5px var(--heavy); }

/* ---------- calendar ---------- */
.grid { display: grid; grid-template-columns: 170px repeat(7, minmax(0, 1fr)); gap: 8px; }
.dow { font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 0 2px 2px; }
.wk { border-left: 4px solid var(--ink); border-radius: 0 6px 0 0; background: var(--sunk); }
.wk .name { font: 800 24px/1 var(--display); }
.wk .range { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.wk .note { font-size: 13px; margin-top: 8px; line-height: 1.4; }
.tile { border-top: 4px solid var(--c); display: flex; flex-direction: column; gap: 3px; min-height: 128px; padding: 9px 11px 16px; }
.tile .head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.tile .dn { font: 800 26px/1 var(--display); }
.tile .wd { font-size: 12px; color: var(--ink-2); margin-left: 4px; }
.tile .ti { font-size: 13.5px; font-weight: 600; line-height: 1.25; margin-top: 4px; }
.tile .key { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.tile .more { font-size: 12px; color: var(--ink-2); margin-top: auto; padding-top: 4px; }
.tile.is-today { box-shadow: 0 0 0 2px var(--ink); }
.status { font-size: 11.5px; font-weight: 700; }
.status.partial { color: var(--warn); } .status.missed { color: var(--ink-2); }
.check { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--good); color: #fff; flex: none; }
.check svg { width: 14px; height: 14px; }
.check.similar { background: var(--similar); color: var(--similar-ink); }
.tile.complete { background: color-mix(in srgb, var(--good) 9%, var(--surface)); }
.tile.similar { background: color-mix(in srgb, var(--similar) 12%, var(--surface)); }
.tile.complete .ti, .tile.complete .key { opacity: .75; }
td.ok { color: var(--good); font-weight: 700; } td.no { color: var(--ink-2); }
.blank { min-height: 128px; padding: 9px 11px; color: color-mix(in srgb, var(--ink-2) 55%, transparent); font: 800 26px/1 var(--display); }

/* ---------- sheets ---------- */
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px 20px; display: grid; gap: 12px; align-content: start; }
.panel h2 { font-size: 26px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12.5px; padding: 0 12px 6px 0; white-space: nowrap; }
td { padding: 8px 12px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; padding-left: 18px; }
tr > :last-child { padding-right: 0; }
td small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.rules { display: grid; gap: 10px; }
.rules div { display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: start; font-size: 14px; }
.scroll { overflow-x: auto; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; border-bottom: 1px solid var(--line); position: relative; }
.bars i { flex: 1; background: var(--ink-2); min-width: 6px; border-radius: 2px 2px 0 0; }
.bars i.low { background: var(--bad); }
.bars .line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--bad); }
svg text { fill: var(--ink-2); font: 500 11px var(--text); }

/* ---------- detail panel ---------- */
dialog { border: 0; padding: 0; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
  background: var(--surface); color: var(--ink); border-radius: 8px; border-top: 6px solid var(--c, var(--ink)); box-shadow: 0 20px 60px -20px #000a; }
dialog::backdrop { background: color-mix(in srgb, #0B0E11 55%, transparent); }
.dlg { padding: 20px 24px 24px; display: grid; gap: 16px; }
.dlg .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.dlg h2 { font-size: 34px; }
.dlg h3 { font-size: 15px; }
.dlg .why { display: grid; gap: 12px; max-width: 64ch; }
.dlg .close { justify-self: start; font: 600 14px/1 var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; background: var(--ink); color: var(--surface); border: 0; }
.dlg .close:focus-visible { outline: 3px solid var(--volume); outline-offset: 2px; }

/* ---------- lock screen (phone page only) ---------- */
.lock { max-width: 420px; margin: 12vh auto 0; display: grid; gap: 14px; }
.lock h1 { font-size: 72px; font-weight: 900; }
.lockform { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.lockform label { font-weight: 600; font-size: 14px; }
.lockform input[type=password] { font: inherit; font-size: 17px; padding: 11px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.lockform input[type=password]:focus-visible { outline: 3px solid var(--volume); outline-offset: 1px; }
.lockform .rem { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink-2); }
.lockform button { font: 600 16px/1 var(--text); padding: 13px; border-radius: 6px; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; }
.lockform button:disabled { opacity: .6; }
.lockform .err { color: var(--bad); font-size: 14px; min-height: 1em; }

/* ---------- coach ---------- */
.coach { text-align: left; width: 100%; }
.coach-body { display: grid; gap: 8px; max-width: 72ch; font-size: 14.5px; }
.coach-body h3 { font-size: 15px; margin-top: 6px; }
.coach-body ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- weigh-in ---------- */
.act { font: 600 14px/1 var(--text); padding: 11px 16px; border-radius: 6px; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; }
.act:focus-visible, .wform input:focus-visible { outline: 3px solid var(--volume); outline-offset: 2px; }
.wform { display: grid; gap: 14px; }
.wform label { display: grid; gap: 5px; font-weight: 600; font-size: 14px; }
.wform label small { font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
.wform .u { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink-2); }
.wform input { font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: start; }
.wform details summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.wform details[open] summary { margin-bottom: 12px; }
.wform .err { font-size: 14px; min-height: 1em; margin: 0; }
.wform .err.bad { color: var(--bad); } .wform .err.ok { color: var(--good); font-weight: 600; }
.wform button[type=submit] { justify-self: start; }
.wform button:disabled { opacity: .6; }

@media (max-width: 1000px) {
  .mast { grid-template-columns: 1fr; }
  .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .today { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid .corner { display: none; }
  .wk { grid-column: 1 / -1; }
  .tile .key, .tile .more { display: none; }
  .tile { min-height: 96px; }
  .blank { min-height: 0; }
}
@media (max-width: 640px) {
  .goals { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
  .dow, .blank { display: none; }
  .tile { min-height: 0; }
  .tile .key { display: block; }
}
</style>

<script>
function boot(DATA) {
const P = DATA.plan, L = DATA.live, T = DATA.today;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const D = iso => new Date(iso + "T12:00:00");
const fmt = (iso, o) => D(iso).toLocaleDateString("en-US", o);
const KIND = { 25: ["heavy", "Heavy"], 20: ["volume", "Volume"], 15: ["interval", "Intervals"], 10: ["legs", "Sprints + legs"], 5: ["rest", "Rest"] };
const store = [];
const opener = (cls, inner, detail) => { store.push(detail); return `<button type="button" class="open ${cls}" data-open="${store.length - 1}" aria-haspopup="dialog">${inner}</button>`; };

const reps = it => it.reps[0] === it.reps[1] ? `${it.reps[0]}` : `${it.reps[0]}–${it.reps[1]}`;
const dur = s => s < 60 ? `${s}s` : `${+(s / 60).toFixed(1)} min`;
function weight(it) {
  if (it.kind === "weighted_bw") return it.lb ? `+${it.lb} lb` : "Bodyweight";
  if (it.kind === "bodyweight") return "Bodyweight";
  if (it.kind === "duration") return "";
  if (!it.lb) return it.per_hand ? "Bodyweight" : "";
  return it.per_hand ? `${it.lb} lb per hand` : `${it.lb} lb`;
}
function line(it) {
  if (it.kind === "duration") return it.sets > 1 ? `${it.name} ${it.sets}×${dur(it.seconds)}` : `${it.name}, ${dur(it.seconds)}`;
  const w = weight(it);
  return `${it.name} ${it.sets}×${reps(it)}${w && w !== "Bodyweight" ? " @ " + w.replace(" lb per hand", "s").replace(" lb", "") : ""}`;
}
function keyItem(d) {
  return d.items.find(i => i.kind !== "duration" || i.hard) || d.items[0];
}
function table(items) {
  return `<div class="scroll"><table><tr><th>Exercise</th><th class="n">Sets × reps</th><th class="n">Weight</th></tr>${items.map(it => {
    const sr = it.kind === "duration" ? (it.sets > 1 ? `${it.sets} × ${dur(it.seconds)}` : dur(it.seconds)) : `${it.sets} × ${reps(it)}`;
    return `<tr><td>${esc(it.name)}${it.note ? `<small>${esc(it.note)}</small>` : ""}</td><td class="n">${sr}</td><td class="n">${esc(weight(it))}</td></tr>`;
  }).join("")}</table></div>`;
}
const why = paras => `<div class="why"><h3>Why</h3>${paras.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
const TICK = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>`;
const CHECK = `<span class="check" aria-label="Done" title="Done as planned">${TICK}</span>`;
const SIMCHECK = `<span class="check similar" aria-label="Done with a similar workout" title="Done with a similar workout">${TICK}</span>`;
const mark = st => st === "complete" ? CHECK : st === "similar" ? SIMCHECK : "";
const NOTES = L && L.notes ? L.notes : [], NLOG = L && L.notes_log ? L.notes_log : [];
const noteLines = n => [n.description ? `<li><strong>Workout:</strong> ${esc(n.description)}</li>` : "", ...n.exercise_notes.map(e => `<li><strong>${esc(e.exercise)}:</strong> ${esc(e.note)}</li>`)].join("");
function didTable(date) {
  const c = L && L.completion && L.completion[date];
  if (!c) return "";
  const mine = NOTES.filter(n => n.date === (c.done_on || date));
  const nt = mine.length ? `<div class="coach-body"><h3>Your notes</h3><ul>${mine.map(noteLines).join("")}</ul></div>` : "";
  return didCore(c) + nt;
}
function didCore(c) {
  if (!c.lines.length) return `<div><h3>What you logged</h3><p class="muted">${esc(c.note || "")}</p></div>`;
  const on = c.done_on ? `, on ${fmt(c.done_on, { weekday: "short", month: "short", day: "numeric" })}` : "";
  const head = (c.status === "complete" ? "Done" : c.status === "similar" ? "Done with a similar workout" : c.status === "partial" ? `Partly done (${c.pct}% of planned sets)` : "Not logged yet") + on;
  return `<div><h3>What you logged: ${head}</h3><div class="scroll"><table><tr><th>Exercise</th><th>Logged</th><th class="n"></th></tr>${c.lines.map(l =>
    `<tr><td>${esc(l.name)}${l.added ? "<small>Not in the plan</small>" : ""}</td><td>${esc(l.logged || "Not logged")}</td><td class="n ${l.ok ? "ok" : "no"}">${l.ok ? "Done" : ""}</td></tr>`).join("")}</table></div></div>`;
}

let h = "";

// masthead
h += `<header class="mast"><div><h1>${esc(P.label.split(" ")[0])}</h1><p class="lede">${esc(P.intro || "")} Anything with a folded corner opens its reasoning.</p></div>
${opener("monthwhy", `<h3>Why the month is built this way</h3><p>${esc(P.why.body[0])}</p>`, { title: P.why.title, meta: "October 2026", body: why(P.why.body.slice(1)) , lead: P.why.body[0] })}</header>`;

// today
if (T) {
  const [k, label] = KIND[T.plate];
  const b = T.band || "none";
  h += `<section class="sec" aria-label="Today">${opener(`today k-${k}`, `<div><div class="when"><span>${esc(fmt(T.date, { weekday: "long", month: "long", day: "numeric" }))}</span><span class="pill">${label}</span><span class="band ${b}">${T.readiness == null ? "No readiness yet" : "Readiness " + T.readiness}</span></div>
    <h2 style="display:flex;align-items:center;gap:12px">${esc(T.title)}${L ? mark(L.days[T.date]) : ""}</h2><ol>${T.items.map(i => `<li>${esc(line(i))}</li>`).join("")}</ol></div>
    <div class="side"><p>${esc(T.headline)}</p>${(T.changes || []).map(c => `<p>${esc(c)}</p>`).join("")}
    <p class="muted">${T.pushed ? `In Hevy as "${esc(T.pushed.title)}", loaded ${esc(T.pushed.at)}.` : "Not loaded into Hevy yet."}</p></div>`,
    { title: T.title, color: k, meta: fmt(T.date, { weekday: "long", month: "long", day: "numeric" }), lead: T.headline, body: didTable(T.date) + table(T.items) + why(T.why) })}</section>`;
}

// coach's latest review (reviews/*.md), rendered from a small subset of Markdown
const mdLite = md => {
  let out = "", list = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
  for (const raw of md.split(/\r?\n/)) {
    const l = raw.trim();
    if (/^[-*] /.test(l)) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(l.slice(2))}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (!l || l.startsWith("# ")) continue;
    out += l.startsWith("## ") ? `<h3>${inline(l.slice(3))}</h3>` : `<p>${inline(l)}</p>`;
  }
  return out + (list ? "</ul>" : "");
};
const CR = L && L.coach;
if (CR) {
  const title = (CR.text.match(/^# (.+)$/m) || [, CR.kind === "month" ? "The month ahead" : "This week"])[1];
  const sec = (CR.text.split(/^## /m)[1] || "").split(/\r?\n/), bullets = sec.filter(l => /^\s*[-*] /.test(l));
  const first = [sec[0], ...bullets.slice(0, 2)].join("\n");
  h += `<section class="sec" aria-label="Coach">${opener("panel coach", `<div class="sec-head"><h2>Coach's notes</h2><p class="muted">${esc(fmt(CR.date, { weekday: "long", month: "short", day: "numeric" }))}</p></div>
    <p><strong>${esc(title)}</strong></p><div class="coach-body">${mdLite("## " + first)}</div><p class="muted">Open for the full review.</p>`,
    { title, meta: `Coach's ${CR.kind === "month" ? "monthly" : "weekly"} review, ${fmt(CR.date, { month: "long", day: "numeric" })}`, body: `<div class="coach-body">${mdLite(CR.text)}</div>` })}</section>`;
}

// your Hevy notes, and what the coach did about them
if (L && (NOTES.length || NLOG.length)) {
  h += `<section class="panel" aria-label="Your notes"><div class="sec-head"><h2>Your notes in Hevy</h2><p class="muted">Read every morning before your workout loads.</p></div>
  ${NLOG.length ? `<div class="coach-body">${NLOG.slice(0, 2).map(s => `<h3>${esc(fmt(s.date, { weekday: "short", month: "short", day: "numeric" }))}</h3>${mdLite(s.text)}`).join("")}</div>` : ""}
  ${NOTES.length ? `<details><summary class="muted" style="cursor:pointer;font-weight:600">Everything you've noted in the last two weeks (${NOTES.length})</summary><div class="coach-body" style="margin-top:10px">${NOTES.map(n => `<h3>${esc(fmt(n.date, { weekday: "short", month: "short", day: "numeric" }))}: ${esc(n.workout || "")}</h3><ul>${noteLines(n)}</ul>`).join("")}</div></details>` : ""}</section>`;
}

// the error log: only ever on screen when something is actually wrong
const ERR = L && L.errors ? L.errors : null;
if (ERR && ERR.open) {
  const row = e => {
    const times = e.count > 1 ? ` · ${e.count}x since ${esc(fmt(e.first_seen.slice(0, 10), { month: "short", day: "numeric" }))}` : "";
    return `<div style="margin:10px 0"><h3 style="margin:0">${esc(e.where)} <span class="muted" style="font-weight:400">(${esc(e.kind)}${times})</span></h3>`
         + `<p style="margin:2px 0 0">${esc(e.detail)}</p>`
         + (e.hint ? `<p class="muted" style="margin:2px 0 0">${esc(e.hint)}</p>` : "") + `</div>`;
  };
  h += `<section class="panel" aria-label="Problems"><div class="sec-head"><h2>Something needs a look</h2>`
    + `<p class="muted">${ERR.open} open. Emailed to you every Monday at 7:30.</p></div>`
    + `<div class="coach-body">${ERR.entries.map(row).join("")}</div></section>`;
}

// the issues log: what keeps coming up, what was tried, and whether it worked
const ISS = L && L.issues ? L.issues : null;
if (ISS && ISS.issues.length) {
  const open = ISS.issues.filter(i => i.status !== "closed");
  const shut = ISS.issues.filter(i => i.status === "closed");
  const quiet = n => n === 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`;
  const one = i => {
    const r = i.review, t = (i.tried || [])[i.tried ? i.tried.length - 1 : 0];
    const bits = [`${r.mentions} mention${r.mentions === 1 ? "" : "s"}, last ${quiet(r.quiet_days)}`];
    if (r.needs_call) bits.push("<strong>needs a verdict</strong>");
    let body = `<p class="muted" style="margin:2px 0 0">${bits.join(" · ")}</p>`;
    if (t) {
      const o = t.outcome;
      body += `<p style="margin:4px 0 0"><strong>Tried ${esc(fmt(t.date, { month: "short", day: "numeric" }))}:</strong> ${esc(t.action)}`
            + ` <span class="muted">— ${esc(t.why)}</span></p>`
            + `<p class="muted" style="margin:2px 0 0">${o ? `Verdict: <strong>${esc(o.result)}</strong> — ${esc(o.note)}` : esc(r.read)}</p>`;
    } else {
      body += `<p class="muted" style="margin:4px 0 0">Nothing tried yet.</p>`;
    }
    if (i.closed) body += `<p class="muted" style="margin:2px 0 0">Closed ${esc(fmt(i.closed.date, { month: "short", day: "numeric" }))}: ${esc(i.closed.why)}</p>`;
    const quotes = i.mentions.slice(-4).reverse().map(m =>
      `<li><em>"${esc(m.quote)}"</em> <span class="muted">${esc(fmt(m.date, { month: "short", day: "numeric" }))}</span></li>`).join("");
    return `<div style="margin:12px 0"><h3 style="margin:0">${esc(i.what)}`
         + `${i.kind === "body" ? ' <span class="muted" style="font-weight:400">(body)</span>' : ""}</h3>${body}`
         + `<details style="margin-top:4px"><summary class="muted" style="cursor:pointer">Your words</summary><ul>${quotes}</ul></details></div>`;
  };
  h += `<section class="panel" aria-label="Issues"><div class="sec-head"><h2>What keeps coming up</h2>`
    + `<p class="muted">${open.length} open. Anything quiet for ${ISS.quiet_days_before_a_call} days gets a verdict on Monday.</p></div>`
    + `<div class="coach-body">${open.map(one).join("")}</div>`
    + (shut.length ? `<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-weight:600">Settled (${shut.length})</summary><div class="coach-body">${shut.map(one).join("")}</div></details>` : "")
    + `</section>`;
}

// weigh-in: saves straight to Hevy's body measurements; Hevy stamps when each day's entry was first logged
const WF = [["weight_kg", "lb", "Weight", "lb"], ["waist", "waist", "Waist", "in", "At the navel"], ["neck_cm", "neck", "Neck", "in", "Just below the Adam's apple"]];
const WMORE = [["chest_cm", "chest", "Chest", "in"], ["left_bicep_cm", "bicep_l", "Left biceps", "in", "Flexed"], ["right_bicep_cm", "bicep_r", "Right biceps", "in", "Flexed"], ["shoulder_cm", "shoulders", "Shoulders", "in"]];
const localISO = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const stamp = at => at ? new Date(at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const WLOG = L && L.body ? (L.body.log || []) : [];
function weighTable() {
  if (!WLOG.length) return `<p class="muted">Nothing logged yet. Your first entry starts the trend.</p>`;
  const more = WMORE.filter(f => WLOG.some(r => r[f[1]]));
  const v = (x, u) => x == null ? "–" : `${x}${u === "lb" ? "" : '"'}`;
  return `<div class="scroll"><table><tr><th>Date</th><th>Logged</th><th class="n">Weight</th><th class="n">Waist</th><th class="n">Neck</th>${more.map(f => `<th class="n">${f[2]}</th>`).join("")}</tr>
  ${WLOG.slice(0, 6).map(r => `<tr><td>${esc(fmt(r.date, { weekday: "short", month: "short", day: "numeric" }))}</td><td>${esc(stamp(r.at))}</td><td class="n">${v(r.lb, "lb")}</td><td class="n">${v(r.waist)}</td><td class="n">${v(r.neck)}</td>${more.map(f => `<td class="n">${v(r[f[1]])}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
if (L) h += `<section class="panel" aria-label="Weight and measurements"><div class="sec-head"><h2>Weight and measurements</h2><button type="button" class="act" data-weigh>Log weight + measurements</button></div><div id="weigh-log">${weighTable()}</div></section>`;

// goals
const G = L && L.goals;
function progress(g) {
  if (!G) return "";
  const x = G[g.id];
  let t = "";
  if (g.id === "sessions") t = `<div class="ticks">${Array.from({ length: x.total }, (_, i) => `<i class="${i < x.value ? "on" : ""}${i === 19 ? " mark" : ""}"></i>`).join("")}</div>`;
  if (g.id === "measure") t = `<div class="ticks">${Array.from({ length: 20 }, (_, i) => `<i class="${i < x.weighins ? "on" : ""}"></i>`).join("")}</div>`;
  if (g.id === "sleep") t = `<div class="ticks">${Array.from({ length: Math.max(5, x.bad.length) }, (_, i) => `<i class="${i < x.bad.length ? "bad" : ""}"></i>`).join("")}</div>`;
  if (g.id === "volume") t = `<p class="base">${x.weeks.map(w => `${esc(w.week)}: ${w.chest} chest (${w.upper} upper), ${w.biceps} biceps`).join("<br>")}</p>`;
  return `${t}<p class="status" style="color:var(${x.met ? "--good" : "--ink"})">${esc(x.text)}</p>`;
}
h += `<section class="sec" aria-label="Goals"><h2>Four goals for October</h2><div class="goals">${P.goals.map(g =>
  opener("goal", `<h3>${esc(g.name)}</h3><p class="target">${esc(g.target)}</p><p class="base">${esc(g.base)}</p>${progress(g)}`,

// calendar
const byDate = Object.fromEntries(P.days.map(d => [d.date, d]));
h += `<section class="sec" aria-label="Calendar"><div class="sec-head"><h2>The month, day by day</h2><div class="legend">${[25, 20, 15, 10, 5].map(p => `<span class="k-${KIND[p][0]}"><i></i>${KIND[p][1]}</span>`).join("")}</div></div>
<div class="grid"><span class="dow corner"></span>${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<span class="dow">${d}</span>`).join("")}`;
for (const w of P.weeks) {
  const s = D(w.start), cells = [];
  for (let i = 0; i < 7; i++) { const dd = new Date(s); dd.setDate(s.getDate() + i); const iso = dd.toISOString().slice(0, 10); cells.push({ iso, d: byDate[iso] }); }
  const inM = cells.filter(c => c.d);

  h += opener("wk", `<div class="name">${esc(w.name)}</div><div class="range">${range}</div><p class="note">${esc(w.note)}</p>`,
    { title: w.name, meta: range, lead: w.note, body: why(w.why) });
  for (const c of cells) {
    if (!c.d) { h += `<div class="blank" aria-hidden="true">${D(c.iso).getDate()}</div>`; continue; }
    const d = c.d, [k, label] = KIND[d.plate], st = L && L.days[d.date];
    const ki = keyItem(d), more = d.items.length - 1;
    const pc = L && L.completion && L.completion[d.date];
    const status = mark(st) || (st === "partial" ? `<span class="status partial">Partial, ${pc.pct}%</span>` : st === "missed" ? `<span class="status missed">Missed</span>` : "");
    h += opener(`tile k-${k}${st === "complete" || st === "similar" ? " " + st : ""}${T && T.date === d.date ? " is-today" : ""}`,
      `<span class="head"><span><span class="dn">${D(d.date).getDate()}</span><span class="wd">${fmt(d.date, { weekday: "short" })}</span></span>${status}</span>
       <span class="ti">${esc(d.title)}</span><span class="key">${esc(d.type === "rest" ? "Weigh in, waist, neck" : line(ki))}</span>${more > 0 && d.type !== "rest" ? `<span class="more">+${more} more</span>` : ""}`,
      { title: d.title, color: k, meta: `${fmt(d.date, { weekday: "long", month: "long", day: "numeric" })}`, label, body: didTable(d.date) + table(d.items) + why(d.why) });
  }
}
h += `</div></section>`;

// weights + readiness
h += `<section class="two"><div class="panel"><h2>Where the weights come from</h2>
<p class="muted">Your best set from the last 90 days becomes an estimated max: Brzycki up to 6 reps, Epley for 7 to 10, and straight sets repeated 4 or more times count as 2 reps short of failure. Working weights leave about 2 reps in the tank. Dumbbell weights are per hand.</p>
<div class="scroll"><table><tr><th>Lift</th><th>Evidence</th><th class="n">Est. max</th><th class="n">October start</th></tr>
${(P.evidence || []).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="n">${esc(r[2])}</td><td class="n">${esc(r[3])}</td></tr>`).join("")}
</table></div></div>
<div class="panel"><h2>How readiness changes a day</h2><p class="muted">Checked each morning once your ring syncs. A session is never cancelled, only scaled.</p>
<div class="rules">${P.readiness.map((r, i) => `<div><span><span class="band ${["green", "yellow", "red"][i]}">${esc(r.band)}</span></span><span>${esc(r.rule)}</span></div>`).join("")}</div>
</div></section>`;

// every muscle
const MUSCLES = [["chest", "Chest"], ["lats", "Lats"], ["upper_back", "Upper back"], ["traps", "Traps"], ["shoulders", "Shoulders (side and rear)"],
  ["biceps", "Biceps"], ["triceps", "Triceps"], ["forearms", "Forearms"], ["abdominals", "Abs"], ["lower_back", "Lower back"], ["glutes", "Glutes"],
  ["quadriceps", "Quads"], ["hamstrings", "Hamstrings"], ["calves", "Calves"], ["adductors", "Inner thighs"], ["abductors", "Outer hips"], ["neck", "Neck"]];
const planned = {};
P.days.filter(d => d.week === "w1").forEach(d => d.items.forEach(i => { if (i.muscle && i.muscle !== "cardio") [i.muscle, ...(i.also || [])].forEach(m => planned[m] = (planned[m] || 0) + i.sets); }));
const pmax = Math.max(...Object.values(planned));
const done = L && L.muscles_week ? L.muscles_week.sets : null;
h += `<section class="panel" aria-label="Every muscle"><div class="sec-head"><h2>Every muscle, every week</h2><p class="muted">All 17 muscle groups Hevy tracks. Hard sets in a build week${done ? `, and what you've logged since ${esc(fmt(L.muscles_week.start, { month: "short", day: "numeric" }))}` : ""}.</p></div>
<div class="scroll"><table><tr><th>Muscle</th><th>Planned sets per build week</th><th class="n">Sets</th>${done ? `<th class="n">Done this week</th>` : ""}</tr>
${MUSCLES.map(([k, n]) => { const v = planned[k] || 0; return `<tr><td>${n}</td><td style="width:50%"><span style="display:block;height:10px;border-radius:2px;background:var(${(P.priorities || []).includes(k) ? "--heavy" : "--ink-2"});width:${(v / pmax) * 100}%"></span></td><td class="n">${v}</td>${done ? `<td class="n">${done[k] || 0}</td>` : ""}</tr>`; }).join("")}
</table></div><p class="muted">Red bars are the priorities, at growth volume. Everything else gets a maintenance dose. A few compound lifts count toward more than one muscle. Cardio covers all five energy systems on top of this.</p></section>`;

// live panels
if (L) {
  const sb = L.scoreboard.map(s => `<tr><td>${esc(s.name)}</td><td class="n">${s.baseline ?? "–"}</td><td class="n">${s.current ?? "Not yet"}</td><td class="n">${s.baseline && s.current ? ((s.current - s.baseline) >= 0 ? "+" : "") + (s.current - s.baseline) : ""}</td></tr>`).join("");
  const c = L.body.comp, last = c[c.length - 1], first = c[0], wts = L.body.weights;
  let spark = `<p class="muted">Log a weigh-in in Hevy's body measurements and your trend starts here.</p>`;
  if (wts.length >= 2) {
    const xs = wts.map(w => w.lb), lo = Math.min(...xs) - 1, hi = Math.max(...xs) + 1, W = 320, H = 90;
    const pts = xs.map((v, i) => `${(i / (xs.length - 1)) * (W - 40) + 30},${H - 14 - ((v - lo) / (hi - lo)) * (H - 28)}`).join(" ");
    spark = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Body weight trend"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2"/><text x="0" y="14">${hi.toFixed(0)}</text><text x="0" y="${H - 4}">${lo.toFixed(0)}</text></svg>`;
  }
  const comp = last && last.bf ? `<p>Latest (${fmt(last.date, { month: "short", day: "numeric" })}): about ${last.bf}% body fat, ${last.fat_lb ?? "?"} lb fat and ${last.lean_lb ?? "?"} lb lean. Waist ${last.waist_in} in.</p>${first !== last && first.fat_lb && last.fat_lb ? `<p>Since ${fmt(first.date, { month: "short", day: "numeric" })}: fat ${(last.fat_lb - first.fat_lb).toFixed(1)} lb, lean ${(last.lean_lb - first.lean_lb >= 0 ? "+" : "")}${(last.lean_lb - first.lean_lb).toFixed(1)} lb.</p>` : ""}`
    : `<p class="muted">Add waist and neck on Sundays and this splits your weight into fat and lean mass.</p>`;
  const rec = L.recent.filter(r => r.sleep);
  const sleep = rec.length ? `<div class="bars">${rec.map(r => `<i class="${r.sleep < 65 ? "low" : ""}" style="height:${r.sleep}%" title="${esc(r.day)}: ${r.sleep}"></i>`).join("")}<span class="line" style="bottom:65%"></span></div><p class="muted">Last ${rec.length} nights. The dashed line is 65.</p>` : `<p class="muted">No sleep data yet.</p>`;
  h += `<section class="two"><div class="panel"><h2>Strength scoreboard</h2><div class="scroll"><table><tr><th>Lift</th><th class="n">Sep max</th><th class="n">October best</th><th class="n">Change</th></tr>${sb}</table></div></div>
  <div class="panel"><h2>Recomp</h2>${spark}${comp}</div><div class="panel"><h2>Sleep</h2>${sleep}</div></section>
  <p class="muted" style="font-size:13px">Updated ${esc(L.updated)}.</p>`;
}

document.getElementById("app").innerHTML = h;

// detail panel
const dlg = document.getElementById("dlg"), body = document.getElementById("dlg-body");
document.addEventListener("click", e => {
  const b = e.target.closest("[data-open]");
  if (!b) return;
  const x = store[+b.dataset.open];
  dlg.style.setProperty("--c", x.color ? `var(--${x.color})` : "var(--ink)");
  body.innerHTML = `<div class="meta"><span>${esc(x.meta || "")}</span>${x.label ? `<span class="pill k-${x.color}">${esc(x.label)}</span>` : ""}</div>
    <h2 id="dlg-title">${esc(x.title)}</h2>${x.lead ? `<p>${esc(x.lead)}</p>` : ""}${x.body}<button class="close" type="button">Close</button>`;
  dlg.showModal();
  body.querySelector(".close").addEventListener("click", () => dlg.close());
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

// weigh-in form
const HEVY = "https://api.hevyapp.com/v1/body_measurements", KEYNAME = "recomp-hevy-key";
const hevyKey = () => { try { return window.RECOMP_HEVY_KEY || localStorage.getItem(KEYNAME); } catch { return window.RECOMP_HEVY_KEY || null; } };
const toMetric = (f, x) => f[3] === "lb" ? x / 2.20462 : x * 2.54;
const field = (f, r) => `<label><span>${f[2]}</span><span class="u"><input name="${f[0]}" type="number" inputmode="decimal" step="0.1" min="0" value="${r && r[f[1]] != null ? r[f[1]] : ""}">${f[3]}</span>${f[4] ? `<small>${f[4]}</small>` : ""}</label>`;
function weighForm(date) {
  const r = WLOG.find(x => x.date === date);
  dlg.style.setProperty("--c", "var(--ink)");
  body.innerHTML = `<div class="meta"><span>Saves to Hevy</span></div><h2 id="dlg-title">Log weight + measurements</h2>
    <p>Same conditions every time: morning, after the bathroom, before eating. Leave blank anything you didn't measure.</p>
    <form id="weigh" class="wform" novalidate>
      <label>Date<input name="date" type="date" value="${date}" max="${localISO()}" required></label>
      <div class="wgrid">${WF.map(f => field(f, r)).join("")}</div>
      <details${r && WMORE.some(f => r[f[1]]) ? " open" : ""}><summary>More: chest, arms, shoulders</summary><div class="wgrid">${WMORE.map(f => field(f, r)).join("")}</div></details>
      ${hevyKey() ? "" : `<label>Hevy API key <small>One time on this device. In Hevy: Settings, then Developer, then copy the API key. It's saved only in this browser.</small><input name="key" type="password" autocomplete="off" required></label>`}
      ${r ? `<p class="muted">Already logged for this day${r.at ? ` (first at ${esc(stamp(r.at))})` : ""}. Saving updates it and keeps anything you leave blank.</p>` : ""}
      <button type="submit" class="act">Save to Hevy</button><p class="err" role="status"></p>
    </form><button class="close" type="button">Cancel</button>`;
  if (!dlg.open) dlg.showModal();
  body.querySelector(".close").addEventListener("click", () => dlg.close());
  const form = body.querySelector("#weigh"), msg = form.querySelector(".err");
  form.date.addEventListener("change", () => weighForm(form.date.value || localISO()));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const say = (t, cls) => { msg.textContent = t; msg.className = "err " + cls; };
    const date = form.date.value, vals = {};
    for (const f of [...WF, ...WMORE]) {
      const raw = form[f[0]].value.trim();
      if (raw === "") continue;
      const x = parseFloat(raw);
      if (!(x > 0)) return say(`${f[2]} doesn't look like a number.`, "bad");
      vals[f[0]] = Math.round(toMetric(f, x) * 100) / 100;
    }
    if (!date) return say("Pick a date.", "bad");
    if (!Object.keys(vals).length) return say("Enter at least one number.", "bad");
    if (vals.weight_kg && (vals.weight_kg < 36 || vals.weight_kg > 230)) return say("That weight looks off. It's in pounds.", "bad");
    const key = (form.key && form.key.value.trim()) || hevyKey();
    if (!key) return say("Paste your Hevy API key first.", "bad");
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Saving";
    const hd = { "api-key": key, "content-type": "application/json", accept: "application/json" };
    try {
      let res = await fetch(`${HEVY}/${date}`, { headers: hd });
      if (res.status === 401 || res.status === 403) throw new Error("key");
      const existed = res.ok;
      if (res.ok) {   // Hevy's update overwrites every field, so carry over what's already there
        const cur = await res.json(), merged = {};
        for (const [k, x] of Object.entries(cur)) if (!["id", "date", "created_at", "updated_at"].includes(k)) merged[k] = x;
        res = await fetch(`${HEVY}/${date}`, { method: "PUT", headers: hd, body: JSON.stringify({ ...merged, ...vals }) });
      } else if (res.status === 404) {
        res = await fetch(HEVY, { method: "POST", headers: hd, body: JSON.stringify({ date, ...vals }) });
      }
      if (res.status === 401 || res.status === 403) throw new Error("key");
      if (!res.ok) throw new Error(`Hevy said ${res.status}`);
      if (form.key) { try { localStorage.setItem(KEYNAME, key); } catch {} }
      const saved = await (await fetch(`${HEVY}/${date}`, { headers: hd })).json();
      const inch = cm => cm ? Math.round(cm / 2.54 * 100) / 100 : null;
      const row = { date, at: saved.created_at, lb: saved.weight_kg ? Math.round(saved.weight_kg * 2.20462 * 10) / 10 : null,
        waist: inch(saved.waist), neck: inch(saved.neck_cm), chest: inch(saved.chest_cm), bicep_l: inch(saved.left_bicep_cm),
        bicep_r: inch(saved.right_bicep_cm), shoulders: inch(saved.shoulder_cm) };
      const i = WLOG.findIndex(x => x.date === date);
      if (i >= 0) WLOG[i] = row; else WLOG.push(row);
      WLOG.sort((a, b) => b.date.localeCompare(a.date));
      document.getElementById("weigh-log").innerHTML = weighTable();
      btn.textContent = "Saved";
      const when = saved.created_at ? stamp(saved.created_at) : "";
      say((existed ? `Updated in Hevy${when ? ` (this day was first logged ${when})` : ""}.` : `Saved to Hevy${when ? `, logged ${when}` : ""}.`) +
        " Goals and the trend update on the next refresh, within the hour.", "ok");
    } catch (err) {
      btn.disabled = false; btn.textContent = "Save to Hevy";
      if (err.message === "key") { try { localStorage.removeItem(KEYNAME); } catch {} say("Hevy didn't accept that API key. Copy it again from Hevy's Developer settings.", "bad"); }
      else say(`Couldn't save: ${err.message}. Check your connection and try again.`, "bad");
    }
  });
}
document.addEventListener("click", e => { if (e.target.closest("[data-weigh]")) weighForm(localISO()); });
}

(() => {
  const plain = JSON.parse(document.getElementById("recomp-data").textContent);
  if (plain) return boot(plain);
  const enc = JSON.parse(document.getElementById("recomp-enc").textContent);
  const KEY = "recomp-pass";
  const store = { get() { try { return localStorage.getItem(KEY); } catch { return null; } },
                  set(v) { try { localStorage.setItem(KEY, v); } catch {} }, clear() { try { localStorage.removeItem(KEY); } catch {} } };
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(enc.iv) }, key, bytes(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const app = document.getElementById("app");
  function showLock(msg) {
    app.innerHTML = `<section class="lock"><h1>Recomp</h1><p class="muted">Your training data is locked. Enter your passphrase to open it.</p>
      <form id="unlock" class="lockform"><label for="pass">Passphrase</label><input id="pass" type="password" autocomplete="current-password" required>
      <label class="rem"><input id="remember" type="checkbox" checked> Remember on this device</label>
      <button type="submit" id="unlock-btn">Unlock</button><p class="err" role="alert">${msg || ""}</p></form></section>`;
    document.getElementById("pass").focus();
    document.getElementById("unlock").addEventListener("submit", async e => {
      e.preventDefault();
      const pass = document.getElementById("pass").value, btn = document.getElementById("unlock-btn");
      btn.disabled = true; btn.textContent = "Unlocking";
      try {
        const data = await open(pass);
        if (document.getElementById("remember").checked) store.set(pass);
        boot(data);
      } catch { showLock("That passphrase didn't work. Check it and try again."); }
    });
  }
  const saved = store.get();
  if (saved) open(saved).then(boot).catch(() => { store.clear(); showLock(); });
  else showLock();
})();
</script>
